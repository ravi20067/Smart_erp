# File Storage
app.file-storage.root=./storage
app.file-storage.max-file-size=52428800

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=50MB

# Maximum size of the entire multipart request
spring.servlet.multipart.max-request-size=100MB
# Allowed file types
app.file-storage.allowed-types=image/jpeg,image/png,image/webp,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet


# Ollama AI Query Engine Configuration
ollama.base-url=http://localhost:11434
ollama.sql-model=sqlcoder:7b
ollama.response-model=qwen2.5-coder:7b
ollama.connect-timeout=10s
ollama.read-timeout=120s
ollama.sql-max-tokens=512
ollama.response-max-tokens=768
ollama.unload-after-use=true

# AI Query Engine Settings
ai.query.max-rows=100
ai.query.query-timeout-seconds=10
ai.query.schema-cache-ttl-seconds=300
ai.query.rate-limit-per-minute=20
ai.query.readonly-datasource.enabled=false
